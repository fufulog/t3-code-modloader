name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install. Same suite as the pre-push hook, including the
      # zero-cost-with-no-mods gate (test/zero-cost.test.mjs).
      - run: npm test
